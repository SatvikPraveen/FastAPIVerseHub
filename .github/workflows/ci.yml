name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_SYSTEM_PYTHON: "1"

jobs:
  lint:
    name: Lint & format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: "pyproject.toml"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: uv pip install ruff
      - run: ruff check app scripts alembic
      - run: ruff format --check app scripts alembic

  typecheck:
    name: mypy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: "pyproject.toml"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: uv pip install -e ".[dev]"
      - run: mypy app

  test:
    name: Tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: "pyproject.toml"
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv pip install -e ".[dev]"
      - name: Run test suite
        env:
          ENVIRONMENT: testing
          JWT_SECRET_KEY: ci-only-secret-not-for-production-0123456789
        run: >
          pytest -p no:cacheprovider
          --cov=app --cov-report=xml --cov-report=term
          --junitxml=test-results/junit.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-py${{ matrix.python-version }}
          path: |
            test-results/
            coverage.xml

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: fastapiversehub:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke-test the image
        # The image defaults to ENVIRONMENT=production, whose settings guard
        # refuses placeholder secrets; give it a development profile and a
        # SQLite database so migrations and the liveness probe run for real.
        run: |
          docker run -d --name smoke -p 8000:8000 \
            -e ENVIRONMENT=development \
            -e DATABASE_URL=sqlite:////tmp/smoke.db \
            -e RATE_LIMIT_ENABLED=false \
            fastapiversehub:ci
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8000/health/live >/dev/null 2>&1; then break; fi
            sleep 1
          done
          curl -fsS http://localhost:8000/health/live
          docker logs smoke | tail -n 20
          docker rm -f smoke

  openapi:
    name: OpenAPI artefact
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: "pyproject.toml"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: uv pip install -e ".[dev]" pyyaml
      - run: python scripts/generate_openapi_spec.py
      - uses: actions/upload-artifact@v4
        with:
          name: openapi-spec
          path: docs/openapi/
