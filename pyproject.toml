# File Location: pyproject.toml

[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fastapi-verse-hub"
version = "1.0.0"
description = "A comprehensive FastAPI learning and demonstration project"
authors = [
    {name = "Satvik Praveen", email = "satvikpraveen707@gmail.com"}
]
readme = "README.md"
license = {text = "MIT"}
keywords = ["fastapi", "python", "api", "learning", "education"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
    "Framework :: FastAPI",
    "Topic :: Internet :: WWW/HTTP :: HTTP Servers",
    "Topic :: Education",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
requires-python = ">=3.11"

dependencies = [
    # FastAPI and core dependencies
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "pydantic[email]>=2.5.0",
    "pydantic-settings>=2.1.0",
    
    # Database
    "sqlalchemy[asyncio]>=2.0.0",
    "alembic>=1.13.0",
    "psycopg2-binary>=2.9.0",
    "asyncpg>=0.29.0",
    
    # Authentication & Security
    "python-jose[cryptography]>=3.3.0",
    "bcrypt>=4.1.0",
    "python-multipart>=0.0.6",
    "itsdangerous>=2.1.0",
    
    # HTTP Client
    "httpx>=0.25.0",
    
    # Redis
    "redis>=5.0.0",
    
    # Email
    "aiosmtplib>=3.0.0",
    "jinja2>=3.1.0",
    
    # File handling
    "aiofiles>=23.2.0",
    "python-magic>=0.4.27",
    "pillow>=10.1.0",
    
    # Utilities
    "python-dotenv>=1.0.0",
    "rich>=13.7.0",

    # Observability
    "structlog>=24.1.0",
    "prometheus-client>=0.20.0",
    
    # WebSockets
    "websockets>=12.0",

    # SSE
    "sse-starlette>=1.6.0",

    # MFA / QR codes
    "pyotp>=2.9.0",
    "qrcode[pil]>=7.4.2",
]

[project.optional-dependencies]
dev = [
    # Testing
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
    "pytest-xdist>=3.5.0",
    "pytest-timeout>=2.2.0",
    "httpx>=0.25.0",
    "aiosqlite>=0.19.0",
    "fakeredis>=2.20.0",
    
    # Code quality
    "ruff>=0.6.0",
    "mypy>=1.10.0",
    "pre-commit>=3.6.0",
    
    # Development tools
    "watchfiles>=0.21.0",
    "faker>=20.1.0",
]

production = [
    # Monitoring
    "sentry-sdk[fastapi]>=1.38.0",
    
    # Performance
    "gunicorn>=21.2.0",
    "gevent>=23.9.0",
    
    # Logging
    "python-json-logger>=2.0.7",
]

docs = [
    "mkdocs>=1.5.0",
    "mkdocs-material>=9.4.0",
    "mkdocs-swagger-ui-tag>=0.6.0",
]

all = [
    "fastapi-verse-hub[dev,production,docs]"
]

[project.urls]
Homepage = "https://github.com/SatvikPraveen/FastAPIVerseHub"
Repository = "https://github.com/SatvikPraveen/FastAPIVerseHub.git"
Documentation = "https://github.com/SatvikPraveen/FastAPIVerseHub/tree/main/docs"
Issues = "https://github.com/SatvikPraveen/FastAPIVerseHub/issues"

[project.scripts]
fastapi-verse-hub = "app.main:main"

# Tool configurations

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.setuptools.package-data]
"app" = ["templates/*.html", "static/*"]



[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["alembic/versions", ".venv", "build", "dist", "generate_fastapi_project.sh"]

[tool.ruff.lint]
select = [
    "E", "W",    # pycodestyle
    "F",         # pyflakes
    "I",         # isort
    "UP",        # pyupgrade
    "B",         # flake8-bugbear
    "SIM",       # flake8-simplify
    "ASYNC",     # flake8-async
    "RUF",       # ruff-specific
    "PIE",       # flake8-pie
    "C4",        # comprehensions
]
ignore = [
    "B008",      # function calls in argument defaults are the FastAPI Depends() idiom
    "E501",      # line length is enforced by the formatter
    "RUF012",    # mutable class attributes (SQLAlchemy / pydantic patterns)
    "SIM108",    # ternary-vs-if is a style call
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"alembic/env.py" = ["E402"]
"app/tests/*" = ["B017", "ASYNC", "RUF029"]
"scripts/*" = ["E402", "ASYNC250"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]
exclude = ["app/tests/", "scripts/", "alembic/", "build/", "dist/"]
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = false
check_untyped_defs = true
no_implicit_optional = true
strict_equality = true
show_error_codes = true
pretty = true
ignore_missing_imports = true
# Tighten module-by-module as annotations land:
disallow_untyped_defs = false
disallow_incomplete_defs = false

[[tool.mypy.overrides]]
module = ["app.core.security", "app.core.config", "app.services.file_service"]
disallow_untyped_defs = true
disallow_incomplete_defs = true

[tool.pytest.ini_options]
testpaths = ["app/tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "e2e: marks tests as end-to-end tests",
    "unit: marks tests as unit tests",
    "performance: marks tests as performance tests",
]
addopts = [
    "--strict-markers",
    "--strict-config",
    "--timeout=60",
    "--disable-warnings",
    "--cov=app",
    "--cov-report=term-missing",
    "--cov-report=html:test-results/htmlcov",
    "--cov-fail-under=80",
]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]

[tool.coverage.run]
source = ["app"]
branch = true
omit = [
    "*/tests/*",
    "*/migrations/*",
    "*/venv/*",
    "*/env/*",
    "*/__pycache__/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]


[tool.bandit]
exclude_dirs = ["tests", "migrations"]
skips = ["B101", "B601"]