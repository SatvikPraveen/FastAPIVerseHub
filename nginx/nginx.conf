worker_processes auto;
pid /run/nginx.pid;

events {
    worker_connections 1024;
    use epoll;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # ── Logging ────────────────────────────────────────────────────────
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" rid=$request_id';

    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log warn;

    # ── Performance ────────────────────────────────────────────────────
    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 20M;

    # ── Rate limiting ──────────────────────────────────────────────────
    limit_req_zone $binary_remote_addr zone=api:10m rate=60r/m;
    limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/m;

    # ── Gzip ───────────────────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json
               application/javascript application/xml+rss application/atom+xml
               image/svg+xml;

    # ── Upstream ───────────────────────────────────────────────────────
    upstream fastapi_app {
        server app:8000;
        keepalive 32;
    }

    # ── HTTP → HTTPS redirect ──────────────────────────────────────────
    server {
        listen 80;
        server_name _;

        # Allow Let's Encrypt ACME challenges
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ── HTTPS server ───────────────────────────────────────────────────
    server {
        listen 443 ssl http2;
        server_name fastapiversehub.com www.fastapiversehub.com;

        # ── TLS ──────────────────────────────────────────────────────────
        ssl_certificate     /etc/letsencrypt/live/fastapiversehub.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/fastapiversehub.com/privkey.pem;

        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 1d;

        # ── Security headers ─────────────────────────────────────────────
        add_header X-Frame-Options          "SAMEORIGIN"   always;
        add_header X-XSS-Protection         "1; mode=block" always;
        add_header X-Content-Type-Options   "nosniff"       always;
        add_header Referrer-Policy          "no-referrer-when-downgrade" always;
        add_header Content-Security-Policy  "default-src 'self' http: https: data: blob: 'unsafe-inline'" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        # ── API proxy ────────────────────────────────────────────────────
        location /api/ {
            limit_req zone=api burst=20 nodelay;

            proxy_pass         http://fastapi_app;
            proxy_http_version 1.1;
            proxy_set_header   Connection        "";
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   X-Request-ID      $request_id;

            proxy_read_timeout  300s;
            proxy_connect_timeout 30s;
        }

        # ── Auth endpoints — stricter rate limit ─────────────────────────
        location ~ ^/api/v[0-9]+/auth/(login|register|forgot-password) {
            limit_req zone=auth burst=5 nodelay;

            proxy_pass         http://fastapi_app;
            proxy_http_version 1.1;
            proxy_set_header   Connection        "";
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }

        # ── WebSocket proxy ──────────────────────────────────────────────
        location /api/v1/ws/ {
            proxy_pass         http://fastapi_app;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade    $http_upgrade;
            proxy_set_header   Connection "upgrade";
            proxy_set_header   Host       $host;
            proxy_set_header   X-Real-IP  $remote_addr;
            proxy_read_timeout 86400s;
        }

        # ── SSE proxy ────────────────────────────────────────────────────
        location /api/v1/sse/ {
            proxy_pass             http://fastapi_app;
            proxy_http_version     1.1;
            proxy_set_header       Connection "";
            proxy_set_header       Host              $host;
            proxy_set_header       X-Real-IP         $remote_addr;
            proxy_set_header       X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_buffering        off;
            proxy_cache            off;
            proxy_read_timeout     3600s;
            chunked_transfer_encoding on;
        }

        # ── Static file uploads ──────────────────────────────────────────
        location /uploads/ {
            alias /app/uploads/;
            # user-uploaded content must never execute or be framed
            add_header X-Content-Type-Options nosniff always;
            add_header Content-Disposition attachment always;
            expires 30d;
            add_header Cache-Control "public, immutable";
        }

        # ── OpenAPI docs ─────────────────────────────────────────────────
        location ~ ^/(docs|redoc|openapi.json) {
            proxy_pass http://fastapi_app;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }

        # ── Health probes (bypass rate limit) ───────────────────────────
        location /health {
            proxy_pass http://fastapi_app;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            access_log off;
        }

        # ── Prometheus scrape endpoint: internal networks only ──────────
        location /metrics {
            allow 10.0.0.0/8;
            allow 172.16.0.0/12;
            allow 192.168.0.0/16;
            deny all;
            proxy_pass http://fastapi_app;
            proxy_http_version 1.1;
            access_log off;
        }
    }
}
